name: Build, Validate & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: forgeai-static-site

jobs:
  validate-html:
    name: Validate static assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          set -e
          for f in index.html styles.css script.js nginx.conf Dockerfile; do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              exit 1
            fi
          done
          echo "All required files present."

      - name: Lint HTML (basic tag balance check via tidy)
        run: |
          sudo apt-get update -y && sudo apt-get install -y tidy
          for f in *.html; do
            echo "Checking $f"
            tidy -q -e "$f" || true
          done

  build-image:
    name: Build Docker image (no push)
    runs-on: ubuntu-latest
    needs: validate-html
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run -d --name smoke-test -p 8080:8080 ${{ env.IMAGE_NAME }}:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8080/healthz
          docker stop smoke-test

  deploy-render:
    name: Trigger Render Deploy
    runs-on: ubuntu-latest
    needs: build-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger deploy via Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Skipping deploy trigger."
            exit 1
          fi
          curl --fail -X POST "$RENDER_DEPLOY_HOOK_URL"