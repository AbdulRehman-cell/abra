name: CI/CD — Build, Test & Deploy to Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prevent concurrent deploys from racing each other
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Smoke Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: static-site:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container for smoke test
        run: |
          docker run -d --name static-site-test -p 8080:8080 static-site:ci
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 15); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' static-site-test || echo "starting")
            echo "Health status: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              break
            fi
            sleep 2
          done
          if [ "$STATUS" != "healthy" ]; then
            echo "Container did not become healthy in time"
            docker logs static-site-test
            exit 1
          fi

      - name: Verify homepage responds
        run: |
          curl -sf http://localhost:8080/ -o /dev/null && echo "Homepage OK"
          curl -sf http://localhost:8080/healthz -o /dev/null && echo "Health check OK"

      - name: Verify key pages exist
        run: |
          for page in about.html blog.html careers.html pricing.html privacy.html; do
            curl -sf "http://localhost:8080/$page" -o /dev/null && echo "$page OK"
          done

      - name: Cleanup
        if: always()
        run: docker rm -f static-site-test || true

  deploy:
    name: Deploy to Render
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl -sf -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'
          echo "Deploy triggered on Render."