version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: forgeai-static-site:1.0.0
    container_name: forgeai-static-site
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - TZ=UTC
    # No database or cache services required — this is a static site with
    # no server-side logic and no persistent state.