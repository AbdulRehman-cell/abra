# Render Blueprint — Infrastructure as Code
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: static-site
    runtime: docker
    plan: starter          # change to "standard" / "pro" for more resources
    region: oregon          # change to your preferred region
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    branch: main
    envVars:
      - key: TZ
        value: UTC
    # No persistent disks or databases needed for a static site.