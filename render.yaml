# Render Blueprint — static-site friendly, but using Docker since a
# Dockerfile is provided (gives full control over headers/caching/healthcheck).
services:
  - type: web
    name: forgeai-static-site
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: UTC
    autoDeploy: true
    branch: main